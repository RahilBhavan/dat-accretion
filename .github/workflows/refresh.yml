# Weekly refresh: re-parse new 8-Ks, rebuild every CSV, the memo and the site, open a PR and merge it when green.
# Needs the repo setting "Allow GitHub Actions to create and approve pull requests" (Settings > Actions > General),
# now on (turned on 2026-09-26). If it is turned off, `gh pr create` fails and the alert step opens an issue.
name: refresh
on:
  schedule:
    - cron: '0 14 * * 2'   # 14:00 UTC Tuesday; Strategy and BitMine file their weekly 8-Ks on Monday
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  statuses: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install pytest numpy
      # Filed documents never change once filed, so data/raw is safe to keep across runs. The submissions index
      # that lists new filings is never cached (dat/edgar.py), so new 8-Ks are still found.
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: edgar-raw-${{ github.run_id }}
          restore-keys: edgar-raw-
      # Exit 0: done. Exit 2: done, and EDGAR has a 10-Q/10-K newer than the anchors (PR stays open, alert fires).
      # Exit 1: a step failed; this step fails, the steps below are skipped and the alert fires.
      - name: refresh the pipeline (parsers, prices, balances, engine, memo, site)
        id: refresh
        timeout-minutes: 20
        run: |
          set +e
          python -m dat.refresh 2>&1 | tee "$RUNNER_TEMP/refresh.log"
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 2 ]
      - name: memo PDF (Chrome is preinstalled on ubuntu-latest)
        timeout-minutes: 3
        run: |   # test -s: Chrome can exit 0 without writing the file
          google-chrome --headless --disable-gpu --no-pdf-header-footer --print-to-pdf=docs/memo.pdf file://$PWD/docs/memo.html
          test -s docs/memo.pdf
      - name: tests
        id: tests
        timeout-minutes: 5
        continue-on-error: true
        run: python -m pytest -q tests
      # Same 5-minute step timeout as snapshot.yml: a hang ends this step, not the job, so the alert still runs.
      - name: done check
        id: check
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set +e
          python check.py 2>&1 | tee "$RUNNER_TEMP/check.log"
          exit ${PIPESTATUS[0]}
      # memo.pdf differs on every build (Chrome stamps the creation time), so it alone is not a change; it rides
      # along in the commit below when something else changed. data/check.json is gitignored (the data branch has it).
      - name: anything changed?
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- data docs site ':!docs/memo.pdf')" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no change in data, docs or site"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"; git status --porcelain -- data docs site
          fi
      - name: commit to refresh/<date>, push, open the PR (body pastes the real check.py output)
        id: pr
        if: steps.diff.outputs.changed == 'true'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="refresh/$(date -u +%F)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git config user.name dat-bot
          git config user.email dat-bot@users.noreply.github.com
          git checkout -b "$branch"
          git add -- data docs site
          git commit -m "Weekly refresh $(date -u +%F): new 8-Ks, prices, attribution, memo, site"
          git push origin "$branch"
          {
            echo "Weekly refresh from run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "pytest: ${{ steps.tests.outcome }}"
            echo
            echo "Refresh summary and reanchor alerts:"
            echo '```'
            grep -E '^(last week|reanchor needed)' "$RUNNER_TEMP/refresh.log" || true
            echo '```'
            echo
            echo "check.py output:"
            echo '```'
            grep -v 'fetched [0-9]*/' "$RUNNER_TEMP/check.log" || true
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          url=$(gh pr create --base main --head "$branch" --title "Weekly refresh $(date -u +%F)" --body-file "$RUNNER_TEMP/body.md")
          echo "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # A push by GITHUB_TOKEN triggers no workflow, and the PR's own pull_request CI run waits for a human to approve
      # it (bot-created PRs, GitHub changelog 2026-06-11). So CI is dispatched on the branch; its job `tests` is the
      # required status check on main.
      - name: run CI on the branch and wait for it
        id: ci
        if: steps.pr.outcome == 'success'
        timeout-minutes: 15
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ steps.pr.outputs.branch }}"
          sha=$(git rev-parse HEAD)   # the commit pushed above; the run must be for it, not an older one
          gh workflow run ci.yml --ref "$branch"
          id=
          for i in $(seq 30); do   # dispatch is async: poll up to 150 s for the run to appear
            id=$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch --json databaseId,headSha \
                 -q ".[] | select(.headSha == \"$sha\") | .databaseId" | head -n 1)
            [ -n "$id" ] && break
            sleep 5
          done
          [ -n "$id" ] || { echo "CI run for $sha on $branch did not start within 150 s"; exit 1; }
          gh run watch "$id" --exit-status --interval 15
          # The required status `tests` (main protection, strict) is the check run of that dispatched CI run. Also
          # report it as a commit status of the same name on the PR head, so the gate holds whichever of the two
          # GitHub reads for a PR opened by GITHUB_TOKEN (whose own pull_request CI run waits at action_required).
          gh api "repos/${{ github.repository }}/statuses/$sha" -f state=success -f context=tests \
            -f description="tests passed in CI run $id (dispatched by refresh.yml)" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/$id"
      - name: squash-merge (only when pytest, check.py and CI passed and no reanchor is needed), then deploy Pages
        id: merge
        if: >-
          steps.ci.outcome == 'success' && steps.tests.outcome == 'success' &&
          steps.check.outcome == 'success' && steps.refresh.outputs.code == '0'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ steps.pr.outputs.branch }}"
          # Wait up to 2 min for the gate to open. The `tests` status makes the PR UNSTABLE (mergeable): the PR's own
          # pull_request CI run stays at action_required and never turns CLEAN. BLOCKED/BEHIND: print the checks.
          for i in $(seq 24); do
            state=$(gh pr view "$branch" --json mergeStateStatus -q .mergeStateStatus)
            echo "mergeStateStatus=$state"
            case "$state" in CLEAN|UNSTABLE) break;; esac
            sleep 5
          done
          case "$state" in CLEAN|UNSTABLE) ;; *) gh pr view "$branch" --json mergeStateStatus,statusCheckRollup;; esac
          head=$(git rev-parse HEAD)   # read before merging: `--delete-branch` switches this checkout to main
          gh pr merge "$branch" --squash --delete-branch
          merged=$(gh pr view "${{ steps.pr.outputs.url }}" --json mergeCommit -q .mergeCommit.oid)
          echo "merged ${{ steps.pr.outputs.url }} as $merged"
          echo "sha=$merged" >> "$GITHUB_OUTPUT"
          # The PR's unapproved pull_request CI run is concluded `failure` with zero jobs once the PR closes. It
          # tested nothing (the dispatched run above did), so delete it rather than leave a red X on main's history.
          .github/scripts/drop_unapproved_pr_runs.sh "${{ github.repository }}" "$branch" "$head"
      # Pushes by GITHUB_TOKEN don't trigger pages.yml, so dispatch it, wait for it, then confirm the live CSVs are
      # the merged ones. A failure here fails the job and the alert step below fires.
      - name: deploy Pages and confirm the live site serves the merged data
        id: publish
        if: steps.merge.outcome == 'success'
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ steps.merge.outputs.sha }}"
          gh workflow run pages.yml --ref main
          id=
          for _ in $(seq 30); do
            id=$(gh run list --workflow pages.yml --event workflow_dispatch --json databaseId,headSha \
                 -q ".[] | select(.headSha == \"$sha\") | .databaseId" | head -n 1)
            [ -n "$id" ] && break
            sleep 5
          done
          [ -n "$id" ] || { echo "pages run for $sha did not start within 150 s"; exit 1; }
          echo "run=$id" >> "$GITHUB_OUTPUT"
          gh run watch "$id" --exit-status --interval 15
          git fetch origin main
          .github/scripts/verify_published.sh "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" "$sha"
      - name: fail the job if a check failed or a reanchor is needed (the alert step below then fires)
        if: >-
          always() && (steps.tests.outcome == 'failure' || steps.check.outcome == 'failure' ||
          steps.ci.outcome == 'failure' || steps.refresh.outputs.code == '2')
        run: exit 1
      # Always prints one `refresh result:` line, and the same line goes to the run's summary page.
      - name: result
        if: always()
        run: |
          url="${{ steps.pr.outputs.url }}"
          if [ "${{ steps.publish.outcome }}" = success ]; then
            line="merged $url as ${{ steps.merge.outputs.sha }}; Pages run ${{ steps.publish.outputs.run }} deployed it and the live CSVs match"
          elif [ "${{ steps.diff.outputs.changed }}" = false ] && [ "${{ job.status }}" = success ]; then
            line="no change in data, docs or site; nothing to merge"
          elif [ -n "$url" ] && [ "${{ steps.merge.outcome }}" != success ]; then
            line="NOT merged: $url left open (refresh=${{ steps.refresh.outputs.code }} tests=${{ steps.tests.outcome }} check=${{ steps.check.outcome }} ci=${{ steps.ci.outcome }} merge=${{ steps.merge.outcome }})"
          else
            line="FAILED before or after the merge (refresh=${{ steps.refresh.outputs.code }} pr=${{ steps.pr.outcome }} merge=${{ steps.merge.outcome }} publish=${{ steps.publish.outcome }})"
          fi
          echo "refresh result: $line"
          echo "refresh result: $line" >> "$GITHUB_STEP_SUMMARY"
      # cancelled() too: a job that hits its 60-minute limit is cancelled, and that must alert as well.
      - name: alert (one open issue per failure streak; comment on it if already open)
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "Reanchor needed" only when nothing else failed: a PR, CI or merge failure keeps the failed title.
          title="Weekly refresh failed"
          if [ "${{ steps.refresh.outputs.code }}" = 2 ] && [ "${{ steps.tests.outcome }}" = success ] \
             && [ "${{ steps.check.outcome }}" = success ] && [ "${{ steps.pr.outcome }}" != failure ] \
             && [ "${{ steps.ci.outcome }}" != failure ] && [ "${{ steps.merge.outcome }}" != failure ]; then
            title="Reanchor needed"
          fi
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          detail=$(grep '^reanchor needed' "$RUNNER_TEMP/refresh.log" 2>/dev/null || true)
          .github/scripts/alert_issue.sh "$title" "$url $detail"
