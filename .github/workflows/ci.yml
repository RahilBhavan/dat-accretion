name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # refresh.yml runs it on refresh/<date>: PRs opened by GITHUB_TOKEN trigger no pull_request run
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install pytest numpy
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - name: balance figure (M28) model test, and site/balance.js matches its source
        run: |
          node site-src/balance/model.test.mjs
          node site-src/balance/build.mjs
          git diff --exit-code -- site/balance.js
