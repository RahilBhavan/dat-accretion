name: ci
on:
  pull_request:
  push:
    branches: [main]
  # refresh.yml dispatches this on refresh/<date>. The bot PR's own pull_request run waits for a human approval that
  # never comes; refresh.yml deletes that zero-job run after the merge. A job-level `if` cannot skip it: the approval
  # gate holds the whole run before any job condition is read, and `branches` filters match the base, not the head.
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - name: balance figure (M28) model test, and site/balance.js matches its source
        run: |
          node site-src/balance/model.test.mjs
          node site-src/balance/build.mjs
          git diff --exit-code -- site/balance.js
