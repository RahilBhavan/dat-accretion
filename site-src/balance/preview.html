<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance preview</title>
<style>
  html { background: #fbfbf9; color: #16181c; }
  html[data-theme="dark"] { background: #0f1216; color: #e9ecf0; }
  @media (prefers-color-scheme: dark) { html:not([data-theme]) { background: #0f1216; color: #e9ecf0; } }
  body { margin: 0; font: 15px/1.6 Georgia, serif; }
  main { width: min(var(--w, 760px), 100% - 32px); margin: 24px auto 64px; }
  .bar { display: flex; gap: 8px; margin-bottom: 16px; font: 12px ui-monospace, monospace; }
  .bar button { font: inherit; }
  #log { font: 11px ui-monospace, monospace; opacity: .6; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <div class="bar"><button data-set="light">light</button><button data-set="dark">dark</button><button data-set="">system</button></div>
  <div id="fig"></div>
  <div id="log"></div>
</main>
<script src="../../site/balance.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme");
  if (q.get("w")) document.querySelector("main").style.setProperty("--w", q.get("w") + "px");
  document.querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.set) document.documentElement.dataset.theme = b.dataset.set; else delete document.documentElement.dataset.theme;
  }));
  const el = document.getElementById("fig");
  el.addEventListener("balancechange", (e) => {
    const d = e.detail;
    document.getElementById("log").textContent = `balancechange ${d.source}: m ${d.m}, price ${d.price}, breakEven ${d.breakEven.toFixed(2)}, perRaise ${d.perRaise.toFixed(2)}, ${d.word}`;
  });
  const opts = { today: { m: 1.191, price: 99.65, label: "week ending Oct 11" } };
  if (q.get("m")) opts.m = Number(q.get("m"));
  if (q.get("price")) opts.price = Number(q.get("price"));
  const fig = window.Balance.mount(el, opts);
  // ?still=1 stops the idle tour (a set() counts as an interaction) so a capture shows the requested values
  if (q.get("still")) fig.set({ m: opts.m ?? 1.2, price: opts.price ?? 90 });
  window.__fig = fig;
</script>
</body>
</html>
