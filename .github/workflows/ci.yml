name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # refresh.yml runs it on refresh/<date>: PRs opened by GITHUB_TOKEN trigger no pull_request run
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest numpy
      - run: python -m pytest -q tests
